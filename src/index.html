    <!-- 自定义确认对话框 -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" data-i18n="modal.confirmTitle">确认</span>
            </div>
            <div class="modal-body">
                <p id="confirm-message" data-i18n="modal.defaultMessage">确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button id="confirm-cancel" class="btn btn-secondary" data-i18n="modal.cancel">取消</button>
                <button id="confirm-ok" class="btn btn-primary" data-i18n="modal.confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 自定义输入对话框 (Prompt) -->
    <div id="prompt-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="prompt-title">输入</span>
            </div>
            <div class="modal-body">
                <p id="prompt-message" style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);"></p>
                <input type="text" id="prompt-input" class="setting-input" style="width: 100%; box-sizing: border-box;">
            </div>
            <div class="modal-footer">
                <button id="prompt-cancel" class="btn btn-secondary" data-i18n="modal.cancel">Cancel</button>
                <button id="prompt-ok" class="btn btn-primary" data-i18n="modal.confirm">Confirm</button>
            </div>
        </div>
    </div>

    <div id="global-speaker-edit-modal" class="modal-overlay hidden"
        style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2147483647; display:flex; align-items:center; justify-content:center; backdrop-filter: blur(2px);">

            <div style="margin-bottom:20px;">

                <input type="text" id="global-speaker-name-input" class="setting-input"

            </div>

            <div style="margin-bottom:24px;">

                <div id="global-speaker-color-palette" style="display:flex; gap:10px; flex-wrap:wrap;">
                    <!-- Colors injected by JS -->
                </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px;">
                <button class="btn-secondary"
                    onclick="document.getElementById('global-speaker-edit-modal').classList.add('hidden')"
                    style="padding: 6px 16px;" data-i18n="modal.cancel">Cancel</button>
                <button class="btn-primary" id="global-btn-save-speaker" style="padding: 6px 16px;" data-i18n="modal.confirm">Save</button>

        </div>

    <!-- Model Manager Modal — wide, short, tabbed -->
    <div id="model-manager-modal" class="modal hidden">
        <div class="modal-content model-manager-modal">
            <div class="modal-header model-manager-header">
                <h3 data-i18n="common.modelManager.title">本地模型管理</h3>
                <button type="button" class="btn-close" id="btn-close-model-manager" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 6l12 12M6 18L18 6" />
                    </svg>
                </button>
            </div>
            <div class="modal-body model-manager-body">
                <p class="model-manager-desc" data-i18n="common.modelManager.desc">
                    管理 Whisper 模型。删除可释放空间，需要时再获取。
                </p>
                <div class="model-tabs" role="tablist">
                    <button type="button" class="model-tab active" data-model-tab="installed" id="model-tab-installed"
                        data-i18n="common.modelManager.installedSection">已安装</button>
                    <button type="button" class="model-tab" data-model-tab="available" id="model-tab-available"
                        data-i18n="common.modelManager.availableSection">可选模型</button>
                </div>
                <div class="model-tab-panel active" id="model-panel-installed" data-model-panel="installed">
                    <div class="model-list" id="model-manager-list">
                        <div class="model-list-empty" data-i18n="common.status.processing">加载中...</div>
                    </div>
                </div>
                <div class="model-tab-panel" id="model-panel-available" data-model-panel="available" hidden>
                    <p class="model-manager-hint" data-i18n="common.modelManager.availableDesc">获取后缓存到本地，可离线使用。</p>
                    <div class="model-list model-list-available" id="available-models-list"></div>
                </div>
            </div>
            <div class="modal-footer license-modal-actions">
                <button type="button" class="btn btn-primary" id="btn-close-model-manager-action"
                    data-i18n="common.actions.close">关闭</button>
            </div>
        </div>
    </div>

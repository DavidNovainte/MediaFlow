    <!-- License Activation Modal -->
    <div id="license-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 data-i18n="common.license.title">激活授权 / Activate Pro License</h3>
                <button class="btn-close" id="btn-close-license-modal">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M6 6l12 12M6 18L18 6" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 15px; color: var(--text-secondary);" data-i18n="common.license.desc">
                    请输入您的正版注册码以解锁所有高级功能。</p>

                <div class="input-group" style="margin-bottom: 15px;">
                    <label class="input-label" data-i18n="common.license.hwidLabel">机器码 (HWID)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="input-hwid" class="input-field" readonly
                            style="background: rgba(255,255,255,0.05); color: var(--text-muted); cursor: pointer; flex: 1;"
                            data-i18n-title="common.actions.copy">
                        <button id="btn-copy-hwid" class="btn btn-secondary" data-i18n-title="common.actions.copy">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
                            </svg>
                            <span data-i18n="common.actions.copy">复制</span>
                        </button>
                    </div>
                    <span class="setting-desc" style="display: block; margin-top: 5px;"
                        data-i18n="common.license.hwidHint">请将此机器码发送给管理员以获取注册码。</span>
                </div>

                <div class="input-group" style="margin-bottom: 20px;">
                    <label class="input-label" data-i18n="common.license.keyLabel">注册码 (License Key)</label>
                    <textarea id="input-license-key" class="input-field" 
                        data-i18n-placeholder="common.license.keyPlaceholder" placeholder="1234-5678-ABCD-EFGH..."
                        style="font-family: 'Consolas', monospace; font-size: 14px; margin-top: 8px; height: 80px; resize: none; width: 100%; box-sizing: border-box; line-height: 1.4;"></textarea>
                </div>

                <div id="license-error-msg" class="status-message error hidden" style="margin-top: 5px;"></div>
            </div>
            <div class="modal-footer license-modal-actions">
                <button type="button" class="btn btn-secondary" id="btn-cancel-license" data-i18n="common.actions.cancel">取消</button>
                <button type="button" class="btn btn-primary" id="btn-submit-license" data-i18n="common.license.submit">立即激活</button>
            </div>
        </div>
    </div>

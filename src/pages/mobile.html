<!-- Mobile Flow View -->
<section id="page-mobile" class="page">
    <div class="card" style="max-width: 1200px; margin: 40px auto; padding: 40px;">
        <style>
            /* Theme-aware: light dropdown options must be dark text on light bg */
            #ip-selector {
                color: var(--text-primary) !important;
                background: transparent !important;
            }

            #ip-selector option {
                background-color: var(--bg-card, #ffffff);
                color: var(--text-primary, #0f1419);
                padding: 10px;
            }

            html[data-theme="dark"] #ip-selector option {
                background-color: var(--bg-card, #18181b);
                color: var(--text-primary, #fafafa);
            }

            /* Modal Styles */
            .modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                opacity: 1;
                transition: opacity 0.3s ease;
            }

            .modal.hidden {
                display: none;
                opacity: 0;
                pointer-events: none;
            }

            .modal-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(4px);
                z-index: 1001;
            }

            .modal-content {
                position: relative;
                background: var(--glass-bg);
                backdrop-filter: var(--glass-blur);
                -webkit-backdrop-filter: var(--glass-blur);
                border: 1px solid var(--glass-border);
                border-radius: var(--radius-lg);
                box-shadow: var(--glass-shadow);
                z-index: 1002;
                width: 90%;
                overflow: hidden;
                animation: modalFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            @keyframes modalFadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px) scale(0.95);
                }

                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .modal-header {
                padding: 24px 32px;
                border-bottom: 1px solid var(--border-color);
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgba(255, 255, 255, 0.02);
            }

            .modal-header h3 {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
                color: var(--text-primary);
                letter-spacing: 0.5px;
            }

            .modal-close {
                background: none;
                border: none;
                color: var(--text-muted);
                cursor: pointer;
                padding: 8px;
                border-radius: 50%;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .modal-close:hover {
                background: var(--fill-hover);
                color: var(--text-primary);
                transform: rotate(90deg);
            }

            /* Reuse Standard Settings Styles */
            .modal-body {
                padding: 32px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .modal .setting-item {
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
                padding: 16px 20px;
                transition: all 0.2s ease;
            }

            .modal .setting-item:hover {
                border-color: var(--accent-primary);
                background: var(--bg-tertiary);
            }

            .modal .pin-control-row {
                display: flex;
                gap: 10px;
                margin-top: 12px;
                width: 100%;
            }

            .modal .input-field-standard {
                flex: 1;
                background: var(--bg-primary);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-sm);
                padding: 10px 14px;
                color: var(--text-primary);
                font-size: 14px;
                outline: none;
                text-align: center;
                letter-spacing: 4px;
                transition: border-color 0.2s;
            }

            .modal .input-field-standard:focus {
                border-color: var(--accent-primary);
            }

            /* Compact mobile settings dialog */
            #mobile-settings-modal.mobile-settings-modal .mobile-settings-dialog {
                max-width: 380px;
                width: calc(100% - 32px);
                max-height: min(72vh, 420px);
                margin: 0;
                padding: 0;
                overflow: hidden;
                border-radius: 12px;
                box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
            }

            #mobile-settings-modal .mobile-settings-header {
                padding: 14px 16px 10px;
                border-bottom: 1px solid var(--border-color);
                min-height: 0;
            }

            #mobile-settings-modal .mobile-settings-header h3 {
                font-size: 15px;
                font-weight: 600;
                margin: 0;
            }

            #mobile-settings-modal .mobile-settings-body {
                padding: 10px 14px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            #mobile-settings-modal .mobile-settings-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 10px 12px;
                border: 1px solid var(--border-color);
                border-radius: 10px;
                background: var(--bg-secondary, var(--bg-card));
            }

            #mobile-settings-modal .mobile-settings-row-stack {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            #mobile-settings-modal .mobile-settings-row-text {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
                flex: 1;
            }

            #mobile-settings-modal .mobile-settings-label {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-primary);
                line-height: 1.25;
            }

            #mobile-settings-modal .mobile-settings-hint {
                font-size: 11.5px;
                line-height: 1.35;
                color: var(--text-muted, #a1a1aa);
            }

            #mobile-settings-modal .mobile-settings-controls {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            #mobile-settings-modal .mobile-settings-input {
                flex: 1;
                min-width: 0;
                max-width: 120px;
                height: 34px;
                padding: 0 10px;
                border: 1px solid var(--border-color);
                border-radius: 8px;
                background: var(--bg-primary);
                color: var(--text-primary);
                font-size: 13px;
                outline: none;
            }

            #mobile-settings-modal .mobile-settings-input-pin {
                max-width: none;
                flex: 1;
                letter-spacing: 0.12em;
                text-align: left;
            }

            #mobile-settings-modal .mobile-settings-input:focus {
                border-color: var(--text-muted, #71717a);
            }

            #mobile-settings-modal .mobile-settings-icon-btn {
                width: 34px;
                min-width: 34px;
                height: 34px;
                padding: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            #mobile-settings-modal .btn-sm {
                height: 34px;
                padding: 0 12px;
                font-size: 12.5px;
                white-space: nowrap;
            }

            #mobile-settings-modal .mobile-settings-pin-tip {
                margin: 0;
                font-size: 11px;
                line-height: 1.35;
                color: var(--text-muted, #a1a1aa);
            }

            #mobile-settings-modal .mobile-settings-pin-tip[hidden],
            #mobile-settings-modal .mobile-settings-pin-tip[style*="display: none"] {
                display: none !important;
            }

            /* Kill old bulky setting-item spacing inside this modal */
            #mobile-settings-modal .setting-item {
                margin: 0;
                padding: 0;
                border: none;
                background: transparent;
            }
        </style>

        <div class="mobile-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
            <div>
                <h2 style="font-size: 24px; margin-bottom: 10px;" data-i18n="mobile.title">手机/电脑互联
                </h2>
                <div id="mobile-status-indicator" style="display: flex; align-items: center; gap: 10px;">
                    <div class="status-dot offline"
                        style="width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); transition: all 0.3s;">
                    </div>
                    <span id="mobile-status-text" style="color: var(--text-secondary);"
                        data-i18n="mobile.status.offline">服务未启动</span>
                </div>
            </div>
            <div style="display: flex; gap: 12px;">
                <!-- 设置按钮 -->
                <button id="btn-mobile-settings" class="btn btn-secondary" style="padding: 10px 20px; font-size: 16px;"
                    data-i18n-title="mobile.actions.settings">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right: 6px;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z">
                        </path>
                    </svg>
                    <span data-i18n="mobile.actions.settings">设置</span>
                </button>
                <!-- 启动服务按钮 -->
                <button id="btn-toggle-mobile-server" class="btn btn-primary"
                    style="padding: 10px 24px; font-size: 16px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right: 8px;">
                        <path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <span data-i18n="mobile.actions.start">启动服务</span>
                </button>
            </div>
        </div>

        <!-- 互联服务设置弹框（紧凑） -->
        <div id="mobile-settings-modal" class="modal hidden mobile-settings-modal">
            <div class="modal-overlay"></div>
            <div class="modal-content mobile-settings-dialog">
                <div class="modal-header mobile-settings-header">
                    <h3 data-i18n="mobile.settings.title">互联服务设置</h3>
                    <button class="modal-close" id="btn-close-mobile-settings" type="button" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body mobile-settings-body">
                    <div class="mobile-settings-row">
                        <div class="mobile-settings-row-text">
                            <span class="mobile-settings-label" data-i18n="mobile.settings.autoStart">自动启动</span>
                            <span class="mobile-settings-hint" data-i18n="mobile.settings.autoStartDesc">打开软件时自动开服务</span>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="mobile-auto-start">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="mobile-settings-row mobile-settings-row-stack">
                        <div class="mobile-settings-row-text">
                            <span class="mobile-settings-label" data-i18n="mobile.settings.portTitle">端口</span>
                            <span class="mobile-settings-hint" data-i18n="mobile.settings.portDesc">默认 8765 · 占用可改 · 运行中保存会重启</span>
                        </div>
                        <div class="mobile-settings-controls">
                            <input type="number" id="mobile-server-port" class="mobile-settings-input"
                                min="1024" max="65535" step="1" value="8765"
                                data-i18n-placeholder="mobile.settings.portPlaceholder" placeholder="8765">
                            <button type="button" id="btn-save-mobile-port" class="btn btn-primary btn-sm">
                                <span data-i18n="mobile.settings.savePort">保存</span>
                            </button>
                        </div>
                    </div>

                    <div class="mobile-settings-row mobile-settings-row-stack">
                        <div class="mobile-settings-row-text">
                            <span class="mobile-settings-label" data-i18n="mobile.settings.pinTitle">PIN 码</span>
                            <span class="mobile-settings-hint" data-i18n="mobile.settings.pinDesc">4–6 位数字，防同网误用；留空=关闭</span>
                        </div>
                        <div class="mobile-settings-controls">
                            <input type="password" id="mobile-pin-code" class="mobile-settings-input mobile-settings-input-pin"
                                data-i18n-placeholder="mobile.settings.pinPlaceholder" placeholder="PIN"
                                maxlength="6" autocomplete="off">
                            <button type="button" id="btn-toggle-pin-visibility" class="btn btn-secondary btn-sm mobile-settings-icon-btn" title="显示/隐藏">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                            <button type="button" id="btn-save-mobile-pin" class="btn btn-primary btn-sm">
                                <span data-i18n="mobile.settings.save">保存</span>
                            </button>
                        </div>
                        <p id="mobile-pin-hint" class="mobile-settings-pin-tip" data-i18n="mobile.settings.pinHint">未设 PIN：局域网均可连</p>
                    </div>
                </div>
            </div>
        </div>


        <div id="mobile-qr-section" class="hidden" style="text-align: center; animation: fadeIn 0.5s;">
            <!-- Horizontal Layout Container -->
            <div
                style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 40px; margin-bottom: 20px;">
                <!-- QR Code Section -->
                <div
                    style="background: white; padding: 20px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
                    <div id="mobile-qr-code"></div>
                </div>

                <!-- Connection Info Container (Vertical Layout, now side-by-side with QR) -->
                <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px;">

                    <!-- IP Selector (Top Level) -->
                    <div
                        style="position: relative; background: var(--fill-muted); padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border-color); display: flex; align-items: center;">
                        <span style="color: var(--text-muted); font-size: 12px; margin-right: 8px;"
                            data-i18n="mobile.connection.networkLabel">网络地址:</span>
                        <div style="position: relative;">
                            <select id="ip-selector" style="
                                background: transparent;
                                color: var(--text-primary);
                                border: none;
                                outline: none;
                                font-size: 13px;
                                cursor: pointer;
                                min-width: 120px;
                                appearance: none;
                                -webkit-appearance: none;
                                padding-right: 20px;
                            ">
                            </select>
                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
                                stroke-width="2"
                                style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted);">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>

                    <!-- URL Box (Bottom Level) -->
                    <div class="server-url-box"
                        style="background: var(--bg-secondary); padding: 15px 25px; border-radius: 50px; display: inline-flex; align-items: center; gap: 15px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1);">

                        <div id="mobile-connection-url">
                            <span class="url-text"
                                style="font-family: 'JetBrains Mono', monospace; color: var(--accent-primary); font-size: 18px; font-weight: 600;"></span>
                        </div>
                        <button id="btn-copy-url" class="btn-icon" title="复制链接"
                            style="padding: 8px; color: var(--text-secondary); transition: color 0.2s;">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div style="margin-top: 25px; color: var(--text-secondary); line-height: 1.6;">
                <p data-i18n="mobile.connection.step1">1. 确保手机/电脑和本机连接同一个 Wi-Fi (局域网)</p>
                <p data-i18n="mobile.connection.step2">2. 手机请扫描二维码，电脑浏览器访问右侧链接</p>
            </div>
        </div>

        <div class="mobile-history" style="margin-top: 50px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 18px; border-left: 4px solid var(--accent-primary); padding-left: 12px; margin: 0;"
                    data-i18n="mobile.history.title">
                    最近接收 (Received)</h3>
                <button id="btn-clear-mobile-history" data-i18n-title="mobile.history.clear" title="清空记录"
                    style="background:none; border:none; cursor:pointer; color:var(--text-secondary); opacity:0.8; padding: 5px; border-radius: 4px; display: flex; align-items: center;"
                    onmouseover="this.style.color='var(--accent-warning)'; this.style.background='rgba(255,100,100,0.1)'"
                    onmouseout="this.style.color='var(--text-secondary)'; this.style.background='none'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2">
                        </path>
                    </svg>
                </button>
            </div>
            <div id="pending-urls-list" class="url-list"
                style="background: var(--bg-secondary); border-radius: 12px; height: 300px; overflow-y: auto; padding: 10px;">
                <div class="empty-hint"
                    style="color: var(--text-muted); text-align: center; padding-top: 100px; display: flex; flex-direction: column; gap: 10px;">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"
                        style="margin: 0 auto; opacity: 0.5;">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span data-i18n="mobile.history.empty">暂无接收记录</span>
                </div>
            </div>
        </div>
    </div>
</section>

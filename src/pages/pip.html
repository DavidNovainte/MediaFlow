<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pip.title">MediaFlow - Picture-in-Picture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* 可拖动的标题栏 */
        .titlebar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 28px;
            background: linear-gradient(180deg, var(--overlay-scrim) 0%, rgba(0, 0, 0, 0.4) 100%);
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s;
        }

        body:hover .titlebar {
            opacity: 1;
        }

        .titlebar-title {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .close-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: no-drag;
            transition: all 0.15s;
        }

        .close-btn:hover {
            background: #ef4444;
            color: white;
        }

        .close-btn svg {
            width: 12px;
            height: 12px;
        }
    </style>
</head>

<body>
    <!-- 可拖动的标题栏 -->
    <div class="titlebar">
        <span class="titlebar-title">🎬 PiP</span>
        <button class="close-btn" id="btn-close" data-i18n-title="pip.close" title="关闭 (Esc)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
    <video id="pip-video" controls autoplay></video>

    <script src="../core/i18n.js"></script>
    <script>
        // 初始化国际化
        if (window.i18n) {
            window.i18n.init();
        }

        // 从 URL 参数获取视频源和时间
        const params = new URLSearchParams(window.location.search);
        const videoSrc = decodeURIComponent(params.get('src') || '');
        const currentTime = parseFloat(params.get('time') || '0');

        const video = document.getElementById('pip-video');

        if (videoSrc) {
            video.src = videoSrc;
            video.currentTime = currentTime;
        }

        // 关闭按钮
        document.getElementById('btn-close').addEventListener('click', () => {
            window.close();
        });

        // ESC 键关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.close();
            }
        });
    </script>
</body>

</html>
